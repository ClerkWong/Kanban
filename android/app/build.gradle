apply plugin: 'com.android.application'

// 先讀 Gradle project property，再退回同名環境變數。
// project property 才是可靠的來源：--no-daemon 仍會為了套用 JVM 設定 fork 一個 single-use
// daemon，build script 內的 System.getenv 讀到的是那個 daemon 的環境，命令列前綴設定的
// 環境變數會遺失。ORG_GRADLE_PROJECT_<name> 由 Gradle client 讀取後轉成 project property
// 傳給 daemon，因此不受影響，且密碼不會像 -P 那樣出現在 ps 的參數列裡。
def signingInput = { String propertyName, String envName ->
    def value = project.findProperty(propertyName)
    if (value == null || value.toString().trim().isEmpty()) {
        value = System.getenv(envName)
    }
    return value
}

def releaseSigningValues = [
    storePath: signingInput('kanbanKeystorePath', 'KANBAN_ANDROID_KEYSTORE_PATH'),
    storePassword: signingInput('kanbanKeystorePassword', 'KANBAN_ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: signingInput('kanbanKeyAlias', 'KANBAN_ANDROID_KEY_ALIAS'),
    keyPassword: signingInput('kanbanKeyPassword', 'KANBAN_ANDROID_KEY_PASSWORD'),
]
def releaseSigningConfigured = releaseSigningValues.values().every {
    it != null && !it.trim().isEmpty()
}
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

android {
    namespace = "com.wongchamber.WongKanban"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wongchamber.WongKanban"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigningValues.storePath)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

if (releaseTaskRequested && !releaseSigningConfigured) {
    throw new GradleException(
        'Release signing is not configured. Set the Gradle project properties ' +
        'kanbanKeystorePath, kanbanKeystorePassword, kanbanKeyAlias and kanbanKeyPassword ' +
        '(easiest via ORG_GRADLE_PROJECT_<name> environment variables, or ' +
        '~/.gradle/gradle.properties). The legacy KANBAN_ANDROID_* environment variables are ' +
        'still read as a fallback, but they are lost when Gradle forks a single-use daemon.'
    )
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
